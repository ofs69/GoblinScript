# What a bare checkout has to pass: no bundle, no soundtrack, no GPU. That is
# what the split buys -- everything below the model is ordinary Rust, and it is
# checked on every push rather than only on the machine that ships. Both
# platforms the release packs are built here, so a Linux-only link error is
# found on a push and not on a tag. Each one links the ONNX Runtime its own
# packages carry -- the `ort` crate's prebuilt on Windows, Microsoft's
# `gpu_cuda12` on Linux -- because that is which build is being checked.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The audio crate links ALSA on Linux; the runner image carries the
      # headers only when asked.
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # Off Windows there is ONE runtime a build can link: Microsoft's own
      # `gpu_cuda12` package, which is also what every Linux zip carries. The
      # `ort` crate publishes no Linux prebuilt for this feature set, and its
      # own CUDA provider reaches no Blackwell card, so a bare `cargo build`
      # here would check a build that nobody ships. The version is PAIRED to
      # the crate: ort-sys rc.13 carries the bindings for 1.28.
      - name: Fetch Microsoft's ONNX Runtime
        if: runner.os == 'Linux'
        shell: bash
        env:
          ORT_VER: 1.28.1
        run: |
          set -eu
          mkdir -p ort
          base=https://github.com/microsoft/onnxruntime/releases/download
          curl -fsSL -o ort/a.tgz "$base/v$ORT_VER/onnxruntime-linux-x64-gpu_cuda12-$ORT_VER.tgz"
          tar -xzf ort/a.tgz -C ort
          echo "ORT_LIB_LOCATION=$(cd ort/onnxruntime-*/lib && pwd)" >> "$GITHUB_ENV"
          # Microsoft ships no static or import library for Linux, only the
          # .so the zip carries, and ort-sys links a lib folder statically
          # unless it is told otherwise -- it looks for libonnxruntime.a,
          # finds none, and says it "could not link".
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"

      # The workspace, so xtask is built too -- it is what packs a release, and
      # a dist run that does not compile is found at the worst moment.
      - name: Build
        run: cargo build --workspace --all-targets

      # The Windows CUDA package is a build of its own, and its provider code
      # sits behind `#[cfg(feature = "cuda")]` -- which the build above does
      # not compile at all on Windows. Without this, a break in that path would
      # wait for a release tag to show itself. It links the `ort` crate's own
      # runtime here: a release links Microsoft's instead, but that is which
      # cards it reaches, not whether the code compiles.
      - name: Build the CUDA variant
        if: runner.os == 'Windows'
        run: cargo build --features cuda

      - name: Test
        run: cargo test --workspace
